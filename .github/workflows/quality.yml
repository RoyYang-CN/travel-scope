name: Travel-Scope public verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify sealed source tree
        run: python -B travel-scope/scripts/verify_product.py
      - name: Verify deterministic installable package
        working-directory: travel-scope
        run: python -B scripts/test_v500_release_package.py
      - name: Scan tracked content for credential-shaped strings
        shell: bash
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'; then
            echo 'Credential-shaped string found in tracked source'
            exit 1
          fi
